version: '3.8'

services:
  cursor2oauth:
    build: .
    container_name: cursor2oauth
    ports:
      - "8010:8010"
    environment:
      - PORT=8010
      - HOST=0.0.0.0
      - API_KEY=${API_KEY:-}
    volumes:
      - cursor-data:/root/.cursor
    restart: unless-stopped

volumes:
  cursor-data: